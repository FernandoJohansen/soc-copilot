# Public deployment on a single server. Caddy is the only service with published ports:
# it gets a TLS certificate for $DOMAIN automatically and proxies to the dashboard, which
# proxies /api to the backend. The database and the API are reachable only inside the
# compose network.
#
#   cp .env.example .env   # fill in the production section
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec api python scripts/seed_demo.py
#
# A local model is opt-in (add --profile ollama and set LLM_PROVIDER=ollama); it needs
# several GB of RAM and answers in minutes on CPU, so a hosted model is the default here.
name: soc-copilot

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: soc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: soc_copilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc -d soc_copilot"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      # Use letters and digits for the password: it is placed in a URL unescaped.
      DATABASE_URL: postgresql+asyncpg://soc:${POSTGRES_PASSWORD}@db:5432/soc_copilot
      EVAL_RESULTS_PATH: /evals/results.json
      AUTO_SEED: "true"
      DEMO_MODE: ${DEMO_MODE:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-claude}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      CORS_ORIGINS: '["https://${DOMAIN}"]'
      # Known assets of the synthetic network the demo logs come from; unset it for real logs.
      ASSET_INVENTORY: ${ASSET_INVENTORY-/app/app/data/synthetic_assets.json}
    volumes:
      - ./evals:/evals:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, e.g. soc.example.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

  ollama:
    image: ollama/ollama
    profiles: [ollama]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-pull:
    image: ollama/ollama
    profiles: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen2.5:3b}"]
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  ollama:
