[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend"]
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in argument defaults

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "eval: evaluation suite over the golden dataset (run with `-m eval`)",
    "agent: needs Postgres and an LLM API key",
]
addopts = "-m 'not eval'"
