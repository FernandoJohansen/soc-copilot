services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: soc
      POSTGRES_PASSWORD: soc
      POSTGRES_DB: soc_copilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc -d soc_copilot"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://soc:soc@db:5432/soc_copilot
      REDIS_URL: redis://redis:6379/0
      EVAL_RESULTS_PATH: /evals/results.json
      AUTO_SEED: "true"
    extra_hosts:
      # lets the container reach an Ollama server running on the host
      - "host.docker.internal:host-gateway"
    volumes:
      - ./evals:/evals:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
